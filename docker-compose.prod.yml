# Production — blue/green deploy with shared MySQL/Redis
# Port 80 = edge proxy (routes to active web-blue or web-green slot)
# Internal health ports: blue 8081, green 8082 (localhost only)

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/state/active.upstream.conf:/etc/nginx/conf.d/active.upstream.conf:ro

  api-blue:
    image: ghcr.io/${GITHUB_REPOSITORY:-avinashims/nodeapi}/api:${IMAGE_TAG:-latest}
    container_name: ecommerce-api-blue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-ecommerce_db}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads
      - imports_data:/app/imports
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  web-blue:
    image: ghcr.io/${GITHUB_REPOSITORY:-avinashims/nodeapi}/web:${IMAGE_TAG:-latest}
    container_name: ecommerce-web-blue
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./ecommerce-frontend/docker/nginx.blue.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-blue:
        condition: service_healthy

  api-green:
    image: ghcr.io/${GITHUB_REPOSITORY:-avinashims/nodeapi}/api:${IMAGE_TAG:-latest}
    container_name: ecommerce-api-green
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-ecommerce_db}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads
      - imports_data:/app/imports
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  web-green:
    image: ghcr.io/${GITHUB_REPOSITORY:-avinashims/nodeapi}/web:${IMAGE_TAG:-latest}
    container_name: ecommerce-web-green
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./ecommerce-frontend/docker/nginx.green.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-green:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  imports_data:
