name: Build and Deploy

on:
  push:
    branches: [ecomm, main]
  workflow_dispatch:
    inputs:
      promote_to_production:
        description: Deploy QA-tested :qa images to Production (manual)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check API JavaScript syntax
        run: find src -name "*.js" -exec node --check {} +

      - name: Lowercase repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "value=latest" >> "$GITHUB_OUTPUT"
          else
            echo "value=qa" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/api:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/api:${{ github.sha }}

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "value=latest" >> "$GITHUB_OUTPUT"
          else
            echo "value=qa" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: ./ecommerce-frontend
          file: ./ecommerce-frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/web:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/web:${{ github.sha }}

  deploy-qa:
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/ecomm' && github.event_name == 'push'
    environment: qa

    steps:
      - name: Deploy to QA server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.QA_HOST || secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -e
            cd /var/www/ecommerce-qa
            git fetch origin ecomm
            git reset --hard origin/ecomm
            if [ -z "$GHCR_TOKEN" ]; then
              echo "GHCR_TOKEN is empty — set it in GitHub Secrets and qa environment"
              exit 1
            fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=qa
            chmod +x scripts/blue-green-deploy.sh
            ./scripts/blue-green-deploy.sh qa deploy
            echo "QA blue/green deploy from branch ecomm commit ${{ github.sha }}"

  deploy-production:
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.promote_to_production == true)
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Promote QA images to latest (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag qa to latest
        if: github.event_name == 'workflow_dispatch'
        run: |
          REPO="${{ steps.repo.outputs.name }}"
          docker pull ${{ env.REGISTRY }}/${REPO}/api:qa
          docker pull ${{ env.REGISTRY }}/${REPO}/web:qa
          docker tag ${{ env.REGISTRY }}/${REPO}/api:qa ${{ env.REGISTRY }}/${REPO}/api:latest
          docker tag ${{ env.REGISTRY }}/${REPO}/web:qa ${{ env.REGISTRY }}/${REPO}/web:latest
          docker push ${{ env.REGISTRY }}/${REPO}/api:latest
          docker push ${{ env.REGISTRY }}/${REPO}/web:latest

      - name: Deploy to Production server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.PROD_HOST || secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -e
            cd /var/www/ecommerce
            git fetch origin main
            git reset --hard origin/main
            if [ -z "$GHCR_TOKEN" ]; then
              echo "GHCR_TOKEN is empty — set it in GitHub Secrets and production environment"
              exit 1
            fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=latest
            chmod +x scripts/blue-green-deploy.sh
            ./scripts/blue-green-deploy.sh prod deploy
            echo "Production blue/green deploy from main commit ${{ github.sha }}"
